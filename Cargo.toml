[package]
name = "el-baul-mcp"
version = "0.1.0"
edition = "2024"
publish = false

# MCP server so people can use their own Claude or ChatGPT with the app.
# The logic lives in mcp/lib.rs; api/mcp.rs is the thin Vercel entry point.
[lib]
path = "mcp/lib.rs"

# Vercel turns each [[bin]] under api/ into a function (here: /api/mcp).
[[bin]]
name = "mcp"
path = "api/mcp.rs"

# Local server for development and tests: cargo run --example local
[[example]]
name = "local"
path = "mcp/local.rs"

[dependencies]
rmcp = { version = "3.6", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
tower = "0.5"
tokio = { version = "1", features = ["full"] }
vercel_runtime = { version = "2.4", features = ["axum"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
