<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar usuarios · El Baul de los Jogos</title><style>:root{--bg:#f4f2ec;--paper:#fffefa;--ink:#1d2923;--muted:#69756d;--line:#e4e3da;--green:#245b45;--mint:#e3efe7;--red:#a63d30}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:28px 18px}header,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px}header{background:var(--ink);color:white}h1{margin:0 0 5px}p{color:var(--muted)}header p{color:#d3ddd5}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:white;font:inherit;font-weight:700;cursor:pointer}.btn.warn{background:#f6e7e3;color:var(--red)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:.8rem;text-transform:uppercase}.status{padding:12px;color:var(--muted)}.badge{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--mint);color:var(--green);font-size:.8rem}.scroll{overflow:auto}@media(max-width:640px){th:nth-child(3),td:nth-child(3){display:none}}</style></head><body><main class="wrap"><header><small>MI LUDOTECA · ADMINISTRACIÓN</small><h1>Usuarios</h1><p>Consulta cuentas y suspende o restaura el acceso.</p></header><div class="bar"><a href="index.html">← Volver a El Baul de los Jogos</a><button class="btn" id="reload">Actualizar</button></div><div class="card"><div id="status" class="status">Comprobando permisos…</div><div class="scroll"><table><thead><tr><th>Cuenta</th><th>Apodo</th><th>Último acceso</th><th>Estado</th><th></th></tr></thead><tbody id="users"></tbody></table></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const $=id=>document.getElementById(id),cfg=window.LUDOTECA_SUPABASE||{},key=cfg.publishableKey||cfg.anonKey,client=window.supabase?.createClient&&cfg.url&&key?window.supabase.createClient(cfg.url,key):null;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function request(method='GET',payload){const{data}=await client.auth.getSession();if(!data.session)throw Error('Inicia sesión para continuar.');const res=await fetch('/api/admin-users',{method,headers:{Authorization:'Bearer '+data.session.access_token,'Content-Type':'application/json'},...(payload?{body:JSON.stringify(payload)}:{})});const body=await res.json();if(!res.ok)throw Error(body.error||'No se pudo completar la operación.');return body}async function load(){if(!client){$('status').textContent='No se pudo conectar con Supabase.';return}try{const{users}=await request();$('status').textContent=users.length+' cuentas';$('users').innerHTML=users.map(u=>{const banned=!!u.banned_until&&new Date(u.banned_until)>new Date();return '<tr><td>'+esc(u.email)+'</td><td>'+esc(u.nickname||'—')+'</td><td>'+esc(u.last_sign_in_at?new Date(u.last_sign_in_at).toLocaleString('es-ES'):'—')+'</td><td><span class="badge">'+(banned?'Suspendida':'Activa')+'</span></td><td>'+(u.email?.toLowerCase()==='sergioadgi38@gmail.com'?'Administrador': '<button class="btn '+(banned?'':'warn')+'" data-id="'+esc(u.id)+'" data-action="'+(banned?'restore':'suspend')+'">'+(banned?'Restaurar':'Suspender')+'</button>')+'</td></tr>'}).join('');document.querySelectorAll('[data-id]').forEach(button=>button.onclick=async()=>{if(!confirm(button.dataset.action==='suspend'?'¿Suspender esta cuenta?':'¿Restaurar el acceso?'))return;try{await request('PATCH',{id:button.dataset.id,action:button.dataset.action});await load()}catch(e){$('status').textContent=e.message}})}catch(e){$('status').textContent=e.message;$('users').innerHTML=''}}$('reload').onclick=load;load();</script></body></html>
