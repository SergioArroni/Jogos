<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4ed">
<title>Administrar usuarios · El Baul de los Jogos</title>
<link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="brand/icon-192.png"><link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<script>const savedTheme=localStorage.getItem('el-baul-theme')||'system';if(savedTheme!=='system')document.documentElement.dataset.theme=savedTheme</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css">
<style>
:root{color-scheme:light;--bg:#f5f4ed;--paper:#fffefa;--surface:#eeeee6;--ink:#1d2923;--muted:#68756c;--line:#e2e4da;--green:#245b45;--green-hover:#194a36;--mint:#e4efe7;--shadow:0 12px 32px #18251d0c;--field:#fffefa;--nav-bg:#fffefa;--nav-active:#e4efe7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111914;--paper:#19231d;--surface:#222f27;--ink:#f1f3ed;--muted:#a9b4aa;--line:#2d3a32;--green:#85b99a;--green-hover:#9ac9aa;--mint:#243a2d;--shadow:0 14px 32px #0003;--field:#19231d;--nav-bg:#19231d;--nav-active:#253c2e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111914;--paper:#19231d;--surface:#222f27;--ink:#f1f3ed;--muted:#a9b4aa;--line:#2d3a32;--green:#85b99a;--green-hover:#9ac9aa;--mint:#243a2d;--shadow:0 14px 32px #0003;--field:#19231d;--nav-bg:#19231d;--nav-active:#253c2e}
.admin-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:24px 0 28px}.admin-head h1{margin:0;font:600 clamp(1.8rem,4vw,2.5rem)/1.1 Fraunces,Georgia,serif}.admin-head p{margin:6px 0 0;color:var(--muted)}.admin-actions{display:flex;align-items:center;gap:8px}.theme-control{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px}.theme-choice{min-height:34px;padding:5px 10px;border:1px solid transparent;border-radius:999px;background:transparent;color:var(--muted);font-size:.77rem}.theme-choice[aria-pressed="true"]{background:var(--mint);color:var(--green)}.admin-card{padding:0;overflow:hidden}.status{min-height:56px;display:flex;align-items:center;gap:9px;padding:15px 18px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.88rem}.status:before{width:8px;height:8px;border-radius:50%;background:var(--green);content:""}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:14px 17px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}td{font-size:.87rem}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--surface)}.badge{display:inline-flex;padding:4px 9px;border-radius:999px;background:var(--mint);color:var(--green);font-size:.74rem;font-weight:700}.btn.warn{background:#f6e7e3;color:#963d30}.btn.warn:hover{background:#f1d9d3}.admin-note{margin-top:17px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);font-size:.82rem}
@media(max-width:640px){.wrap{padding:14px}.admin-head{align-items:flex-start;flex-direction:column;margin:20px 0}.admin-actions{width:100%;justify-content:space-between}.admin-card{border-radius:14px}th,td{padding:12px 10px;font-size:.78rem}th:nth-child(3),td:nth-child(3){display:none}.admin-note{margin-bottom:20px}}
</style>
</head>
<body><main class="wrap"><header class="app-header"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><span class="logo-shape"></span></span><span><span class="brand-name">El Baul de los Jogos</span><span class="brand-caption">Administración de la cuenta</span></span></a><div class="admin-actions"><div class="theme-control" role="group" aria-label="Tema"><button class="theme-choice" type="button" data-theme-choice="system" aria-label="Tema del sistema">◐</button><button class="theme-choice" type="button" data-theme-choice="light" aria-label="Tema claro">☀</button><button class="theme-choice" type="button" data-theme-choice="dark" aria-label="Tema oscuro">☾</button></div><a class="btn ghost small" href="index.html">Volver</a></div></header>
<section class="admin-head"><div><h1>Usuarios</h1><p>Revisa cuentas y administra su acceso.</p></div><button class="btn secondary" id="reload" type="button">↻ Actualizar</button></section>
<section class="card admin-card" aria-label="Cuentas de usuario"><div id="status" class="status" role="status" aria-live="polite">Comprobando permisos…</div><div class="scroll"><table><thead><tr><th>Cuenta</th><th>Apodo</th><th>Último acceso</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="users"></tbody></table></div></section>
<p class="admin-note">Las cuentas de administración no se pueden suspender desde esta pantalla.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script src="dialogs.js"></script>
<script>
const $=id=>document.getElementById(id),cfg=window.LUDOTECA_SUPABASE||{},key=cfg.publishableKey||cfg.anonKey,client=window.supabase?.createClient&&cfg.url&&key?window.supabase.createClient(cfg.url,key):null;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function setTheme(preference){localStorage.setItem('el-baul-theme',preference);if(preference==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=preference;document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();document.querySelectorAll('[data-theme-choice]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.themeChoice===preference)))}document.querySelectorAll('[data-theme-choice]').forEach(button=>button.onclick=()=>setTheme(button.dataset.themeChoice));setTheme(savedTheme);
async function request(method='GET',payload){const{data}=await client.auth.getSession();if(!data.session)throw Error('Inicia sesión para continuar.');const res=await fetch('/api/admin-users',{method,headers:{Authorization:'Bearer '+data.session.access_token,'Content-Type':'application/json'},...(payload?{body:JSON.stringify(payload)}:{})});const body=await res.json();if(!res.ok)throw Error(body.error||'No se pudo completar la operación.');return body}
async function load(){if(!client){$('status').textContent='No se pudo conectar con Supabase.';return}try{const{users}=await request();$('status').textContent=`${users.length} ${users.length===1?'cuenta':'cuentas'}`;$('users').innerHTML=users.map(u=>{const banned=!!u.banned_until&&new Date(u.banned_until)>new Date();return '<tr><td>'+esc(u.email)+'</td><td>'+esc(u.nickname||'—')+'</td><td>'+esc(u.last_sign_in_at?new Date(u.last_sign_in_at).toLocaleString('es-ES'):'—')+'</td><td><span class="badge">'+(banned?'Suspendida':'Activa')+'</span></td><td>'+(u.email?.toLowerCase()==='sergioadgi38@gmail.com'?'Administrador':'<button class="btn small '+(banned?'':'warn')+'" data-id="'+esc(u.id)+'" data-action="'+(banned?'restore':'suspend')+'">'+(banned?'Restaurar':'Suspender')+'</button>')+'</td></tr>'}).join('');document.querySelectorAll('[data-id]').forEach(button=>button.onclick=async()=>{const suspend=button.dataset.action==='suspend';if(!await askConfirm({title:suspend?'¿Suspender esta cuenta?':'¿Restaurar el acceso?',text:suspend?'La persona no podrá entrar en la aplicación hasta que restaures su acceso.':'La persona podrá volver a entrar con su correo o apodo.',confirmLabel:suspend?'Suspender':'Restaurar',danger:suspend}))return;try{await request('PATCH',{id:button.dataset.id,action:button.dataset.action});await load()}catch(e){$('status').textContent=e.message}})}catch(e){$('status').textContent=e.message;$('users').innerHTML=''}}$('reload').onclick=load;load();
</script></body></html>
